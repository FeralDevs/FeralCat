; ══════════════════════════════════════════════════════
;  MeowKit v1.0  ·  ESP32-S3-WROOM-1-N16R8
;  16 MB Flash (DIO)  ·  8 MB OPI PSRAM  ·  LVGL 8.3
; ══════════════════════════════════════════════════════

[env:esp32s3box]
platform               = espressif32@6.0.1
board                  = esp32s3box
framework              = arduino
; Keep the upstream Lua 5.4.7 source as reference; Lua apps use the pinned 5.5.1 library.
lib_ignore             = lua-5.4.7

; ── Flash & Partition ────────────────────────────────
; Retail MeowKit hardware runs the SPI flash in DIO mode (verified against the
; factory image: bootloader header byte @0x2 = 0x02 = DIO). The upstream repo
; shipped QIO, which is marginal on this wiring and bootloops. dio_opi keeps the
; octal PSRAM while switching the flash to DIO.
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_ota_16mb.csv   ; dual-OTA (SD-card updates)

; ── Serial Monitor ───────────────────────────────────
monitor_speed          = 115200

; ── Upload ───────────────────────────────────────────
upload_protocol        = esptool
upload_speed           = 921600

; ── Build ────────────────────────────────────────────
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

build_flags =
    -std=gnu++17
    -I${PROJECT_SRC_DIR}/ui
    -DPROJECT_NAME=\"MeowKit\"
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0              ; USB OTG → TinyUSB (CDC / HID / MSC)
    -DARDUINO_USB_CDC_ON_BOOT=1       
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Wl,-zmuldefs
    -DCORE_DEBUG_LEVEL=3
    -O2
    ; ── ELF loader (spike): internal-RAM exec, libc symbol table ──
    ; Section/mirror mode is the S3-intended path (Kconfig: default y for S3):
    ; it populates elf->sec[] so esp_elf_map_sym() can resolve relocation
    ; offsets. Segment mode leaves sec[] empty → map_sym returns 0 → NULL
    ; write during relocate → hard fault. Internal-RAM exec (no PSRAM/MMU/
    ; cache-offset), so text lands in MALLOC_CAP_EXEC IRAM.
    -DCONFIG_ELF_LOADER_BUS_ADDRESS_MIRROR=1
    -DCONFIG_ELF_LOADER_LIBC_SYMBOLS=1
    -DCONFIG_ELF_LOADER_NUMBER_SYMBOLS=8
    -DCONFIG_ELF_FILE_SYSTEM_BASE_PATH=\"/sdcard\"
    -DELF_LOADER_VER_MAJOR=1
    -DELF_LOADER_VER_MINOR=3
    -DELF_LOADER_VER_PATCH=3
