name: Lua apps and MP3

on:
  pull_request:
  push:
    branches: [feature/lua-apps-mp3-player, meowkit-mine]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure host tests
        run: cmake -S test/lua_apps -B build/native -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests
        run: cmake --build build/native --config Debug --parallel 2
      - name: Run all 13 suites
        run: ctest --test-dir build/native -C Debug --output-on-failure
      - name: Retain test logs and actual LVGL renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lua-native-${{ matrix.os }}
          path: |
            build/native/Testing/Temporary/LastTest.log
            build/native/player_ui/*-preview.ppm

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned build frontend
        run: python -m pip install platformio==6.1.19
      - name: Build ESP32-S3 firmware
        run: python -m platformio run -e esp32s3box
      - name: Retain firmware for device testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-v0.8.1-lua.1
          path: |
            .pio/build/esp32s3box/firmware.bin
            .pio/build/esp32s3box/firmware.elf
            .pio/build/esp32s3box/partitions.bin
